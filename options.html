<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doanlolai - Cài đặt</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    h1 { color: #15803d; }
    .card { border: 1px solid #d1fae5; border-radius: 12px; padding: 16px; background: #f0fdf4; }
    label { display: block; margin-top: 12px; font-weight: 600; color: #166534; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 1px solid #86efac; border-radius: 8px; }
    button { margin-top: 16px; background: #16a34a; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
    .ok { color: #166534; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>doanlolai - Cài đặt</h1>
  <div class="card">
    <label>API Key (OpenRouter)</label>
    <input id="apiKey" type="password" placeholder="Nhập API key..." />

    <label>Model</label>
    <input id="model" value="meta-llama/llama-3.1-8b-instruct:free" />

    <label>Ngôn ngữ dịch mặc định</label>
    <select id="targetLang">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>

    <button id="saveBtn">Lưu cài đặt</button>
    <div class="ok" id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
